[project]
name = "leonardo-gallery"
version = "0.1.0"
description = "Leonardo da Vinci's machines: a single-prompt machinome gallery by Astra"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Luis Henrique Cassis Fagundes"}]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
# These version floors do not describe the post-0.6 API requirement in README.
# The public-site task must establish a reproducible public dependency set.
dependencies = ["machinome[viewer]>=0.6", "cadquery>=2.7", "molejo>=0.2"]

[project.optional-dependencies]
dev = ["playwright>=1.50"]
site = ["sphinx>=8"]

[tool.machinome]
model = "hydraulic_sawmill"

[tool.machinome.models]
hydraulic_sawmill = "models.hydraulic_sawmill.model:LeonardoHydraulicSawmill"
automatic_weaving_loom = "models.automatic_weaving_loom.model:AutomaticWeavingLoom"
cam_hammer = "models.cam_hammer.model:CamHammer"
rack_and_pinion = "models.rack_and_pinion.model:RackAndPinion"
pulley_block = "models.pulley_block.model:PulleyBlock"
swivel_crane = "models.swivel_crane.model:SwivelCrane"

[tool.machinome-studio]
profile = "builder"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = false
include = ["models", "models.*"]
exclude = ["models.*.openspec*", "models.*.docs*", "models.*.scripts*"]
