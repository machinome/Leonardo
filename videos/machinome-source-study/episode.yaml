format: machinome-video-draft/0.2
id: machinome-source-study
title: A machine you can read
status: release-film-scene-study
learningGoal: Show what Machinome means through the actual source of the moving
  sawmill, with AI as a tool and human intention as the purpose.
production: production.yaml
shots:
  - id: source
    start: 0
    end: 28
    speechOffset: 0.8
    narration: >-
      A waterwheel. A saw. A carriage. In Machinome, I describe these parts in
      Python, and write how they move together. Here, the wheel drives the
      crankshaft. These are the actual instructions behind the model. Source
      code you can read, test, and change. I can help write it. You decide
      what to make.
    direction: >-
      A quiet split composition: real Python types on the left, the reconstructed
      sawmill turns on the right. First reveal the named parts, then the drive
      connection. Hold the completed source long enough to read. This is a
      Machinome release-film excerpt, not the earlier mechanism tutorial.
    simulation: {from: 8, to: 24}
    camera:
      - {at: 0, preset: machine}
    hiddenLayers: [structure, foundation, water]
    overlays:
      - {from: 0, to: 28, text: "A machine you can read.", position: top}
      - {from: 22.36, to: 28, text: "MACHINE + GENOME", position: lower-third}
    code:
      snippet: assembly
      typing:
        - {from: 0.8, to: 2, throughLine: 200}
        - {from: 2.16, to: 3.36, throughLine: 201}
        - {from: 3.54, to: 4.16, throughLine: 202}
        - {from: 4.48, to: 8.24, throughLine: 204}
        - {from: 8.28, to: 10.28, throughLine: 205}
        - {from: 10.4, to: 13.12, throughLine: 206}
    evidence: [source, reconstruction]
