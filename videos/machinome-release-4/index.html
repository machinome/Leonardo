<script type="module">
const video=document.querySelector('video');
const manifest=await fetch('_build/narration-manifest.json').then(r=>r.json());
const wanted=new Set(['ancestor','mechanism','research','import','relation','testing','steps','film','mirror','open','cad','stream','purpose']);
for(const beat of [{id:'start',label:'The wheel',start:-3},...manifest.beats.filter(b=>wanted.has(b.id))]){

  button.dataset.time=String(beat.start+3);

  document.querySelector('nav').append(button);
}
