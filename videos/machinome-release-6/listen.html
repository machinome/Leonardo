<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revolutions — English narration audition</title>
<style>
body{max-width:850px;margin:48px auto;padding:0 24px;background:#101419;color:#ece9df;font:18px/1.65 system-ui,sans-serif}
h1{font-size:32px;line-height:1.2}audio{width:100%;margin:18px 0}a{color:#f59269}section{padding:20px 0;border-top:1px solid #374049}
button{font:inherit;background:#27323a;color:#fff;border:1px solid #52616d;border-radius:6px;padding:5px 12px;cursor:pointer}
.direction{color:#bbc4cc;font-size:16px}.player{position:sticky;top:0;background:#101419;padding:8px 0}#status{color:#bbc4cc}
</style>
<h1>Revolutions — English narration, audition 1</h1>
<p>Jessica · one continuous take · no sound effects.</p>
<p id="status">Loading the audition…</p>
<div class="player"><audio id="audio" controls preload="metadata" src="audition-1.mp3"></audio></div>
<p><a href="audition-1.mp3" download>Download MP3</a> · <a href="narration.wav" download>Download the original WAV</a></p>
<p>The notes below record the intended delivery of each passage; listening is the review. The jump buttons are approximate.</p>
<main id="sections"></main>
<script type="module">
const manifest=await(await fetch('narration-manifest.json')).json();
const time=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
document.querySelector('#status').textContent=`Duration: ${time(manifest.duration)}. Complete audio for approval; the picture is synchronized afterwards.`;
const audio=document.querySelector('#audio');
for(const section of manifest.sections){
 // The provider's clock runs up to a second late on this take; start early.
 const from=Math.max(0,section.start-1.5);
 const node=document.createElement('section'),button=document.createElement('button');
 button.textContent=`Listen from ${time(from)}`;
 button.onclick=()=>{audio.currentTime=from;audio.play();};
 const direction=document.createElement('p');direction.className='direction';direction.textContent=section.emotion;
 const text=document.createElement('p');text.textContent=section.text;
 node.append(button,direction,text);document.querySelector('#sections').append(node);
}
</script>
</html>
