format: machinome-visual-experiment/revolutions-opening
episode: ./episode.yaml
through: early-invitation
output: {width: 1920, height: 1080, fps: 30}
speechOffset: 0.8
tailSeconds: 1.3
dictionary: ../machinome-pronunciation/_build/phoneme/dictionary.json
scenes:
  revolution: {kind: machine}
  renaissance: {kind: machine}
  ancestor: {kind: machine}
  machinome: {kind: machine}
  wheel-class:
    kind: code
    snippets: [wheel-imports, wheel-class]
    fileLabel: models/hydraulic_sawmill/parts.py
    fontSize: 27
    lineHeight: 31
  mill-class:
    kind: code
    snippets: [mill-imports, mill-class]
    fileLabel: models/hydraulic_sawmill/model.py
    fontSize: 32
    lineHeight: 41
  early-invitation: {kind: machine}
