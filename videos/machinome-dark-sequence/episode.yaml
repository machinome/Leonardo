format: machinome-visual-experiment/dark-source
status: empirical-sequence-test-not-a-format-proposal
referenceEpisode: ../machinome-source-study/episode.yaml
output: {width: 1920, height: 1080, fps: 30, durationSeconds: 28}
palette: {background: "#111519", foreground: "#dbe2e7"}
direction: >-
  Show the moving sawmill, cut to a quiet full-screen architectural source
  excerpt, then return to the moving sawmill. Dark throughout. Never show code
  and machine simultaneously. Imports and class are already visible on the
  code cut; only the last two lines reveal near the end of that scene.
narration: >-
  A waterwheel. A saw. A carriage. In Machinome, I describe these parts in
  Python, and write how they move together. Here, the wheel drives the
  crankshaft. These are the actual instructions behind the model. Source
  code you can read, test, and change. I can help write it. You decide
  what to make.
sourceCode:
  imports: {file: ../../models/hydraulic_sawmill/model.py, lines: [4, 7]}
  architecture: {file: ../../models/hydraulic_sawmill/model.py, lines: [196, 206]}
  ending: {file: ../../models/hydraulic_sawmill/model.py, lines: [249, 250]}
endingMotion: {from: 16.5, to: 18.5}
sequence:
  - kind: machine
    start: 0
    end: 4.5
    direction: Establish the complete sawmill working; hold the camera still.
    camera: [770, -1037, 824]
    target: [0, -20, 295]
    fov: 37
    simulation: {from: 8, to: 12.5}
    hidden: []
  - kind: code
    start: 4.5
    end: 20.5
    direction: A pure source-code scene with imports, class and simulation method.
  - kind: machine
    start: 20.5
    end: 28
    direction: Return to a closer moving mechanism for the human-purpose closing.
    camera: [740, 940, 705]
    target: [0, 0, 280]
    fov: 37
    simulation: {from: 12.5, to: 20}
    hidden:
      - [Frame and guides, Fixed timber structure]
      - [Frame and guides, Foundation]
      - [Water drive, Water channel]
      - [Water drive, Water surface]
